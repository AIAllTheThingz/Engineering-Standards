version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Internal reusable-workflow SHAs are governed trust anchors and advance only
      # through deliberate, evidence-backed maintenance PRs.
      - dependency-name: "AIAllTheThingz/Engineering-Standards/.github/workflows/*"
  - package-ecosystem: pip
    directory: /.github/dependencies
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /examples/python-project
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
