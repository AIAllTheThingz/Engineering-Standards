name: v1.2.1 PostRelease Lifecycle Validation

on:
  push:
    branches:
      - release/1.2.1-lifecycle-validation
    paths:
      - .github/workflows/release-1.2.1-post-release.yml

permissions:
  contents: read

jobs:
  post-release:
    name: Exact-candidate PostRelease lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout validation control branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout frozen release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AIAllTheThingz/Engineering-Standards
          ref: 7d15ec8be6d8c3cdca35061728901584437e4a50
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout synchronized repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AIAllTheThingz/Engineering-Standards
          ref: master
          path: state
          persist-credentials: false
          fetch-depth: 0

      - name: Verify published external state and synchronized master
        id: external
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateSha = '7d15ec8be6d8c3cdca35061728901584437e4a50'
          $tagObjectSha = 'aea6330ee3d51b3f5bb55031d878ef302ba1dbca'
          $syncMergeSha = 'fa34bb533c8288d283996f2aa4f948c3505b61dc'
          $notesSha = 'a6598577ac6ad67d5f4b55c534a90f15505f80fed822878598c231433b29877d'

          $candidateHead = (& git -C candidate rev-parse HEAD).Trim()
          if ($candidateHead -ne $candidateSha) { throw "Candidate checkout mismatch: $candidateHead" }
          $candidateDirty = @(& git -C candidate status --porcelain=v1)
          if ($candidateDirty.Count -gt 0) { throw 'Candidate checkout is not clean before PostRelease preparation.' }

          & git -C candidate fetch origin 'refs/tags/v1.2.1:refs/tags/v1.2.1' --force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch published v1.2.1 tag.' }
          $observedTagObject = (& git -C candidate rev-parse 'refs/tags/v1.2.1').Trim()
          $observedTagType = (& git -C candidate cat-file -t $observedTagObject).Trim()
          $observedTagTarget = (& git -C candidate rev-parse 'refs/tags/v1.2.1^{}').Trim()
          if ($observedTagObject -ne $tagObjectSha) { throw "Published tag object changed: $observedTagObject" }
          if ($observedTagType -ne 'tag') { throw "Published v1.2.1 is not annotated; observed type '$observedTagType'." }
          if ($observedTagTarget -ne $candidateSha) { throw "Published tag target changed: $observedTagTarget" }

          $stateHead = (& git -C state rev-parse HEAD).Trim()
          & git -C state merge-base --is-ancestor $syncMergeSha $stateHead
          if ($LASTEXITCODE -ne 0) { throw "PR #109 merge $syncMergeSha is not an ancestor of synchronized master HEAD $stateHead." }

          $remoteMaster = ((& git ls-remote https://github.com/AIAllTheThingz/Engineering-Standards.git refs/heads/master) -split "`t")[0].Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMaster -ne $stateHead) {
            throw "Synchronized master checkout is stale: checkout=$stateHead remote=$remoteMaster"
          }

          $matrix = Get-Content -LiteralPath state/governance/downstream-compatibility.json -Raw | ConvertFrom-Json -Depth 100
          if ($matrix.schemaVersion -ne '1.2.0') { throw "Unexpected compatibility schema '$($matrix.schemaVersion)'." }
          $published = @($matrix.governanceReleases | Where-Object { $_.version -eq '1.2.1' })
          if ($published.Count -ne 1) { throw "Expected exactly one published 1.2.1 compatibility record; found $($published.Count)." }
          $releaseState = $published[0]
          if ($releaseState.lifecycle -ne 'Published') { throw "v1.2.1 compatibility lifecycle is '$($releaseState.lifecycle)'." }
          if ($releaseState.supportStatus -ne 'Supported') { throw "v1.2.1 support status is '$($releaseState.supportStatus)'." }
          if ($releaseState.immutableRef -ne 'v1.2.1') { throw "v1.2.1 immutableRef is '$($releaseState.immutableRef)'." }
          if ($releaseState.immutableSha -ne $candidateSha) { throw "v1.2.1 immutableSha is '$($releaseState.immutableSha)'." }

          if ($matrix.unreleasedContract.governanceVersion -ne '1.2.1') { throw 'Current unreleased governanceVersion must remain 1.2.1 after PR #108.' }
          if ($matrix.unreleasedContract.supportStatus -ne 'Preview') { throw 'Current unreleasedContract must remain Preview.' }
          if ($matrix.unreleasedContract.canaryValidationStatus -ne 'NotRun') { throw 'Current moving-master canary status must remain NotRun.' }
          if ($null -ne $matrix.unreleasedContract.canaryValidatedWorkflowSha) { throw 'Current moving-master canary authority must remain null.' }

          $statusText = Get-Content -LiteralPath state/docs/RELEASE_STATUS.md -Raw
          foreach ($requiredText in @(
            'Latest published version | 1.2.1',
            'final PostRelease lifecycle pending',
            $candidateSha,
            $tagObjectSha,
            '370882222'
          )) {
            if (-not $statusText.Contains($requiredText)) { throw "Synchronized release status is missing expected text: $requiredText" }
          }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Engineering-Standards-PostRelease'
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/AIAllTheThingz/Engineering-Standards/releases/tags/v1.2.1' -Headers $headers
          if ([int64]$release.id -ne 370882222) { throw "Unexpected GitHub Release ID '$($release.id)'." }
          if ([bool]$release.draft) { throw 'GitHub Release is unexpectedly draft.' }
          if ([bool]$release.prerelease) { throw 'GitHub Release is unexpectedly prerelease.' }
          $releaseBodyPath = Join-Path $env:RUNNER_TEMP 'v1.2.1-release-body.md'
          [System.IO.File]::WriteAllText($releaseBodyPath, [string]$release.body, [System.Text.UTF8Encoding]::new($false))
          $observedNotesSha = (Get-FileHash -LiteralPath $releaseBodyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedNotesSha -ne $notesSha) { throw "Published release-note hash changed: $observedNotesSha" }

          $pr = Invoke-RestMethod -Uri 'https://api.github.com/repos/AIAllTheThingz/Engineering-Standards/pulls/109' -Headers $headers
          if ([string]::IsNullOrWhiteSpace([string]$pr.merged_at)) { throw 'PR #109 is not recorded as merged.' }
          if ([string]$pr.merge_commit_sha -ne $syncMergeSha) { throw "PR #109 merge SHA changed: $($pr.merge_commit_sha)" }

          $ruleset = Invoke-RestMethod -Uri 'https://api.github.com/repos/AIAllTheThingz/Engineering-Standards/rulesets/20724760' -Headers $headers
          if ($ruleset.target -ne 'tag' -or $ruleset.enforcement -ne 'active') { throw 'Release-tag ruleset is not active for tags.' }
          if (@($ruleset.conditions.ref_name.include) -notcontains 'refs/tags/v*') { throw 'Release-tag ruleset no longer includes refs/tags/v*.' }
          $ruleTypes = @($ruleset.rules | ForEach-Object { $_.type })
          foreach ($requiredRule in @('deletion','non_fast_forward','creation','update')) {
            if ($ruleTypes -notcontains $requiredRule) { throw "Release-tag ruleset is missing '$requiredRule'." }
          }

          "state_head=$stateHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_verified_at=$([DateTimeOffset]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_verified_at=$([DateTimeOffset]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare exact-candidate PostRelease lifecycle record
        shell: pwsh
        env:
          STATE_HEAD: ${{ steps.external.outputs.state_head }}
          TAG_VERIFIED_AT: ${{ steps.external.outputs.tag_verified_at }}
          RELEASE_VERIFIED_AT: ${{ steps.external.outputs.release_verified_at }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateSha = '7d15ec8be6d8c3cdca35061728901584437e4a50'
          $tagObjectSha = 'aea6330ee3d51b3f5bb55031d878ef302ba1dbca'
          $notesSha = 'a6598577ac6ad67d5f4b55c534a90f15505f80fed822878598c231433b29877d'
          $syncMergeSha = 'fa34bb533c8288d283996f2aa4f948c3505b61dc'
          New-Item -ItemType Directory -Path candidate/.tmp/releases -Force | Out-Null

          $record = Get-Content -LiteralPath control/release-lifecycle/1.2.1-pre-release.template.json -Raw | ConvertFrom-Json -Depth 100
          $candidateNotesHash = (Get-FileHash -LiteralPath candidate/docs/releases/1.2.1.md -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateNotesHash -ne $notesSha) { throw "Candidate release-notes hash changed: $candidateNotesHash" }
          $record.releaseNotes.reviewedSha256 = $candidateNotesHash

          $record.publication = [pscustomobject][ordered]@{
            status = 'Passed'
            reason = $null
            tag = [pscustomobject][ordered]@{
              status = 'Passed'
              reason = $null
              name = 'v1.2.1'
              kind = 'annotated'
              objectSha = $tagObjectSha
              targetSha = $candidateSha
              protected = $true
              rewritten = $false
              verifiedAtUtc = $env:TAG_VERIFIED_AT
            }
            githubRelease = [pscustomobject][ordered]@{
              status = 'Passed'
              reason = $null
              url = 'https://github.com/AIAllTheThingz/Engineering-Standards/releases/tag/v1.2.1'
              targetSha = $candidateSha
              draft = $false
              prerelease = $false
              notesSha256 = $candidateNotesHash
              publishedAtUtc = '2026-08-15T00:14:42Z'
            }
            artifacts = @(
              [pscustomobject][ordered]@{
                name = 'release-lifecycle-1.2.1-31846242114'
                sha256 = '7b6c168c1a5b7e7bec0693a0ecc6cda8e94797a51ba0c9b165f03b80b95d7e47'
                provenance = 'GitHub Actions run 31846242114 artifact 9235993449; independently downloaded and SHA-256 verified before publication.'
              }
            )
          }

          $postCanary = [pscustomobject][ordered]@{
            status = 'Passed'
            reason = $null
            repository = 'AIAllTheThingz/Engineering-Standards-Canary'
            canaryCommitSha = '03979bdd46e36593faf044e2206e24c7ed485d62'
            standardsSha = $candidateSha
            publishedRef = 'v1.2.1'
            scenarios = @(
              [pscustomobject][ordered]@{
                name = 'success'; runId = 31853248739; conclusion = 'success'; expectedConclusion = 'success'; verified = $true
                artifact = [pscustomobject][ordered]@{ name = 'governance-evidence-31853248739'; artifactId = 9238210172; sha256 = '75da2fdf61b1c56b7c306eaf16fbb8d8b985f7ef41ee13d814dbd3b3d5c67d56'; downloaded = $true; verified = $true }
              },
              [pscustomobject][ordered]@{
                name = 'controlled-failure'; runId = 31853248720; conclusion = 'failure'; expectedConclusion = 'failure'; verified = $true
                artifact = [pscustomobject][ordered]@{ name = 'governance-evidence-31853248720'; artifactId = 9238209524; sha256 = '595669f03ba1031ae5c693d2341b68545ef4d51e8dd6b0e3815d8226357db7a5'; downloaded = $true; verified = $true }
              },
              [pscustomobject][ordered]@{
                name = 'governance-version-mismatch'; runId = 31853248752; conclusion = 'failure'; expectedConclusion = 'failure'; verified = $true
                artifact = [pscustomobject][ordered]@{ name = 'governance-evidence-31853248752'; artifactId = 9238207090; sha256 = '586353be72b9b1d60d22e5225ae67c4e85f780286b61ad9644c43f2a820dab50'; downloaded = $true; verified = $true }
              },
              [pscustomobject][ordered]@{
                name = 'missing-required-file'; runId = 31853248718; conclusion = 'failure'; expectedConclusion = 'failure'; verified = $true
                artifact = [pscustomobject][ordered]@{ name = 'governance-evidence-31853248718'; artifactId = 9238208902; sha256 = 'fcfd7c9b44a476e7b7d42a2eecabd92b013375d00001a75f3246fc01d882281e'; downloaded = $true; verified = $true }
              },
              [pscustomobject][ordered]@{
                name = 'mandatory-control-disablement'; runId = 31853248799; conclusion = 'failure'; expectedConclusion = 'failure'; verified = $true
                artifact = [pscustomobject][ordered]@{ name = 'governance-evidence-31853248799'; artifactId = 9238211637; sha256 = '856b94df35b8d9921bd0aa3cc0ce6de12a2b2ae6f18e6e66f8be9c5a078ed3ca'; downloaded = $true; verified = $true }
              }
            )
          }

          $postRecord = [pscustomobject][ordered]@{
            schemaVersion = '1.0.0'
            recordType = 'post-release-verification'
            status = 'Passed'
            reason = $null
            repository = 'AIAllTheThingz/Engineering-Standards'
            version = '1.2.1'
            candidateSha = $candidateSha
            verifiedAtUtc = [DateTimeOffset]::UtcNow.ToString('o')
            verifiedBy = 'Issue #103 final PostRelease lifecycle control'
            tagVerification = [pscustomobject][ordered]@{
              status = 'Passed'; reason = $null; name = 'v1.2.1'; objectSha = $tagObjectSha; targetSha = $candidateSha; protected = $true; rewritten = $false; verifiedAtUtc = $env:TAG_VERIFIED_AT
            }
            githubReleaseVerification = [pscustomobject][ordered]@{
              status = 'Passed'; reason = $null; url = 'https://github.com/AIAllTheThingz/Engineering-Standards/releases/tag/v1.2.1'; targetSha = $candidateSha; draft = $false; prerelease = $false; notesSha256 = $notesSha; verifiedAtUtc = $env:RELEASE_VERIFIED_AT
            }
            downstreamCanary = $postCanary
            regressions = @()
            followUpIssues = @()
            compatibilityMatrix = [pscustomobject][ordered]@{
              path = 'governance/downstream-compatibility.json'
              updated = $true
              supportAndDeprecationReviewed = $true
              synchronizedMasterHead = $env:STATE_HEAD
              synchronizationMergeSha = $syncMergeSha
            }
            exceptions = @()
          }
          $postRecordPath = 'candidate/.tmp/releases/1.2.1-post-release-verification.json'
          $postRecord | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $postRecordPath -Encoding utf8NoBOM

          $record.postRelease = [pscustomobject][ordered]@{
            status = 'Passed'
            reason = $null
            refetchedTag = [pscustomobject][ordered]@{
              status = 'Passed'
              reason = $null
              targetSha = $candidateSha
              verifiedAtUtc = $env:TAG_VERIFIED_AT
            }
            githubReleaseVerification = [pscustomobject][ordered]@{
              status = 'Passed'
              reason = $null
              targetSha = $candidateSha
              draft = $false
              prerelease = $false
              verifiedAtUtc = $env:RELEASE_VERIFIED_AT
            }
            downstreamCanary = $postCanary
            regressions = @()
            followUpIssues = @()
            recordPath = '.tmp/releases/1.2.1-post-release-verification.json'
            compatibilityMatrixUpdated = $true
          }
          $record | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath candidate/.tmp/releases/1.2.1-lifecycle.json -Encoding utf8NoBOM

          $dirtyAfter = @(& git -C candidate status --porcelain=v1)
          if ($dirtyAfter.Count -gt 0) { throw 'PostRelease preparation changed tracked candidate state.' }

      - name: Validate PostRelease lifecycle on frozen candidate
        id: validate
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -NoProfile -File candidate/scripts/Test-ReleaseLifecycle.ps1 `
            -Path candidate `
            -EvidencePath .tmp/releases/1.2.1-lifecycle.json `
            -Stage PostRelease `
            -OutputJson candidate/.tmp/releases/1.2.1-post-release-result.json

      - name: Create PostRelease validation identity manifest
        if: always()
        shell: pwsh
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.sha }}
          STATE_HEAD: ${{ steps.external.outputs.state_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $recordPath = 'candidate/.tmp/releases/1.2.1-lifecycle.json'
          $resultPath = 'candidate/.tmp/releases/1.2.1-post-release-result.json'
          $postRecordPath = 'candidate/.tmp/releases/1.2.1-post-release-verification.json'
          [ordered]@{
            schemaVersion = '1.0.0'
            repository = 'AIAllTheThingz/Engineering-Standards'
            candidateSha = '7d15ec8be6d8c3cdca35061728901584437e4a50'
            candidateHead = (& git -C candidate rev-parse HEAD).Trim()
            controlBranch = 'release/1.2.1-lifecycle-validation'
            controlSha = $env:CONTROL_SHA
            synchronizedMasterHead = $env:STATE_HEAD
            synchronizationMergeSha = 'fa34bb533c8288d283996f2aa4f948c3505b61dc'
            runId = [int64]$env:RUN_ID
            runAttempt = [int]$env:RUN_ATTEMPT
            validationOutcome = $env:VALIDATION_OUTCOME
            tagName = 'v1.2.1'
            tagObjectSha = 'aea6330ee3d51b3f5bb55031d878ef302ba1dbca'
            tagTargetSha = '7d15ec8be6d8c3cdca35061728901584437e4a50'
            releaseId = 370882222
            releaseNotesSha256 = 'a6598577ac6ad67d5f4b55c534a90f15505f80fed822878598c231433b29877d'
            publishedRefCanaryCommit = '03979bdd46e36593faf044e2206e24c7ed485d62'
            publishedRefCanaryRuns = @(31853248739,31853248720,31853248752,31853248718,31853248799)
            lifecycleRecordSha256 = $(if (Test-Path -LiteralPath $recordPath) { (Get-FileHash -LiteralPath $recordPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null })
            validationResultSha256 = $(if (Test-Path -LiteralPath $resultPath) { (Get-FileHash -LiteralPath $resultPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null })
            postReleaseRecordSha256 = $(if (Test-Path -LiteralPath $postRecordPath) { (Get-FileHash -LiteralPath $postRecordPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null })
            publicationRun = 31853146258
            publicationArtifactId = 9238154042
            tagRulesetId = 20724760
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath candidate/.tmp/releases/1.2.1-post-release-manifest.json -Encoding utf8NoBOM

      - name: Upload PostRelease lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-postrelease-1.2.1-${{ github.run_id }}
          path: |
            candidate/.tmp/releases/1.2.1-lifecycle.json
            candidate/.tmp/releases/1.2.1-post-release-result.json
            candidate/.tmp/releases/1.2.1-post-release-verification.json
            candidate/.tmp/releases/1.2.1-post-release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce PostRelease lifecycle result
        if: always()
        shell: pwsh
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if ($env:VALIDATION_OUTCOME -ne 'success') {
            throw "PostRelease lifecycle validation did not pass: $env:VALIDATION_OUTCOME"
          }
          Write-Output 'PostRelease lifecycle validation passed for published v1.2.1.'
