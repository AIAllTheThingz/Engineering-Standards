name: Issue 103 Tag Check Review Fix

on:
  push:
    branches:
      - release/1.2.1-postrelease-sync
    paths:
      - .github/workflows/issue-103-tag-check-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/1.2.1-postrelease-sync
          fetch-depth: 0

      - name: Keep live tag checks for snapshots containing the release tag
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/scripts/ReleaseConsistency.Tests.ps1')
          text = path.read_text(encoding='utf-8-sig')
          pattern = re.compile(
              r"    It 'validates the current repository release records' \{.*?(?=    It 'still validates repository-controlled records when tag verification is explicitly unavailable' \{)",
              re.S,
          )
          replacement = """    It 'validates the current repository release records' {
              $repositoryRoot = (Resolve-Path (Join-Path $PSScriptRoot '../..')).Path
              $version = (Get-Content -LiteralPath (Join-Path $repositoryRoot 'VERSION') -Raw).Trim()
              $tag = "v$version"
              $arguments = @('-NoProfile', '-File', $script:validator, '-Path', $repositoryRoot)

              & git -C $repositoryRoot rev-parse --verify --quiet "$tag^{}" *> $null
              if ($LASTEXITCODE -ne 0) {
                  $arguments += '-SkipTagVerification'
              }
              else {
                  $tagTarget = (& git -C $repositoryRoot rev-parse "$tag^{}" 2>$null).Trim()
                  if ($LASTEXITCODE -ne 0 -or $tagTarget -notmatch '^[0-9a-fA-F]{40}$') {
                      throw "Unable to resolve $tag to a commit for release-consistency validation."
                  }

                  & git -C $repositoryRoot merge-base --is-ancestor $tagTarget HEAD *> $null
                  if ($LASTEXITCODE -eq 1) {
                      # A newer external tag may be visible while validating an immutable
                      # historical snapshot that predates the tag target. In that case only,
                      # validate the repository-controlled records without live tag lookup.
                      $arguments += '-SkipTagVerification'
                  }
                  elseif ($LASTEXITCODE -ne 0) {
                      throw "Unable to determine whether $tag belongs to the repository snapshot."
                  }
              }

              $output = @(& pwsh @arguments 2>&1)
              $LASTEXITCODE | Should -Be 0 -Because ($output -join "`n")
          }

          """
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one current-repository test block; replaced {count}.')
          path.write_text(updated, encoding='utf-8', newline='')
          PY

      - name: Validate current published release with full tag verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/Test-ReleaseConsistency.ps1 -Path .
          $testText = Get-Content -LiteralPath tests/scripts/ReleaseConsistency.Tests.ps1 -Raw
          if ($testText -notmatch 'merge-base --is-ancestor') { throw 'Snapshot ancestry guard is missing.' }
          if ($testText -match '-Path \$repositoryRoot -SkipTagVerification 2>&1') { throw 'Unconditional tag-verification bypass remains.' }

      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIAllTheThingz Automation'
          git config user.email 'aiallthethingz@users.noreply.github.com'
          git add tests/scripts/ReleaseConsistency.Tests.ps1
          git commit -m 'test(release): preserve tag checks for current snapshots'
          git push origin HEAD:release/1.2.1-postrelease-sync
