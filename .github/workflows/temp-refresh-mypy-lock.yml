name: Temporary mypy lock refresh

on:
  push:
    branches:
      - dependabot/pip/examples/python-project/mypy-2.3.1

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate hash-locked Python CI dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install pinned pip-tools
        run: python -m pip install --disable-pip-version-check --no-input pip-tools==7.6.0

      - name: Regenerate lock file
        run: >-
          python -m piptools compile
          --allow-unsafe
          --generate-hashes
          --output-file=examples/python-project/requirements-ci.lock
          --strip-extras
          examples/python-project/requirements-ci.in

      - name: Verify targeted update
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^mypy==2\.3\.1' examples/python-project/requirements-ci.lock
          if grep -q '^mypy==2\.3\.0' examples/python-project/requirements-ci.lock; then
            echo 'Stale mypy 2.3.0 pin remains in lock file.' >&2
            exit 1
          fi

      - name: Commit regenerated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples/python-project/requirements-ci.lock
          if git diff --cached --quiet; then
            echo 'Lock file already synchronized.'
            exit 0
          fi
          git commit -m 'chore(deps): refresh mypy 2.3.1 lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
