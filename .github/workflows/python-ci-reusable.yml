name: Governed Python CI reusable

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        required: false
        default: .
      python-version:
        type: string
        required: false
        default: 3.12.11

permissions:
  contents: read

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONSAFEPATH: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout caller without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: caller

      - name: Checkout immutable standards implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AIAllTheThingz/Engineering-Standards
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: standards

      - name: Validate fixed runtime and project path
        shell: pwsh
        run: |
          if ('${{ inputs.python-version }}' -cne '3.12.11') { throw 'python-version must be the reviewed exact version 3.12.11.' }
          $candidate = '${{ inputs.project-path }}'
          if ([IO.Path]::IsPathRooted($candidate) -or $candidate -match '(^|[\\/])\.\.([\\/]|$)') { throw 'project-path must be repository-relative without traversal.' }
          $root = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'caller')).Path
          $projectItem = Get-Item -LiteralPath (Join-Path $root $candidate) -Force
          if ($projectItem.LinkType -or ($projectItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'project-path must not be a link or reparse point.' }
          $project = $projectItem.FullName
          if (-not ($project -eq $root -or $project.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::Ordinal))) { throw 'project-path escaped the caller checkout.' }

      - name: Set up exact CPython 3.13.2 lock resolver
        id: lock_resolver
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.2

      - name: Set up exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11

      - name: Initialize Python evidence workspace
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP 'python-functional'
          New-Item -ItemType Directory -Path (Join-Path $workRoot 'evidence') -Force | Out-Null
          "PYTHON_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify complete hash-locked toolchain closure before installation
        id: lock_verification
        continue-on-error: true
        shell: pwsh
        run: |
          $resolverPython = '${{ steps.lock_resolver.outputs.python-path }}'
          $durableLockLogPath = Join-Path $env:RUNNER_TEMP 'python-lock-verification.log'
          if ([string]::IsNullOrWhiteSpace($resolverPython) -or -not (Test-Path -LiteralPath $resolverPython -PathType Leaf)) {
            'verifier_started=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'verifier_blocked_reason=The exact CPython 3.13.2 lock resolver was unavailable, so validation could not start.' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'The exact CPython 3.13.2 lock resolver was unavailable; no toolchain was installed.' | Tee-Object -FilePath $durableLockLogPath
            throw 'The exact CPython 3.13.2 lock resolver is unavailable.'
          }
          $runtimePython = (Get-Command python -CommandType Application -ErrorAction Stop).Path
          if ([string]::IsNullOrWhiteSpace($runtimePython) -or -not (Test-Path -LiteralPath $runtimePython -PathType Leaf)) {
            'verifier_started=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'verifier_blocked_reason=The exact CPython 3.12.11 functional runtime was unavailable, so validation could not start.' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'The exact CPython 3.12.11 functional runtime was unavailable; no toolchain was installed.' | Tee-Object -FilePath $durableLockLogPath
            throw 'The exact CPython 3.12.11 functional runtime is unavailable.'
          }
          'verifier_started=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & $resolverPython -I standards/scripts/python-project-validation.py `
            --verify-tool-lock `
            --work-root (Join-Path $env:RUNNER_TEMP 'python-lock-resolution') `
            --tool-lock standards/examples/python-project/requirements-ci.lock `
            --resolver-python $resolverPython `
            --runtime-python $runtimePython 2>&1 | Tee-Object -FilePath $durableLockLogPath
          if ($LASTEXITCODE -ne 0) { throw 'The governed Python toolchain lock does not match its complete resolved closure.' }

      - name: Install standards-owned hash-locked toolchain
        if: steps.lock_verification.outcome == 'success'
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'python-tools'
          python -m venv $toolRoot
          $venvPython = Join-Path $toolRoot 'bin/python'
          & $venvPython -I -m pip install --no-input --only-binary=:all: --require-hashes --no-deps -r standards/examples/python-project/requirements-ci.lock
          & $venvPython -I -m pip check
          $toolPython = Join-Path $toolRoot 'bin/python-isolated'
          Copy-Item -LiteralPath $venvPython -Destination $toolPython
          & $toolPython -I -c "import sys; assert sys.prefix == '$toolRoot'"
          "TOOL_PYTHON=$toolPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run governed functional validation
        id: functional
        if: steps.lock_verification.outcome == 'success'
        continue-on-error: true
        run: >-
          "$TOOL_PYTHON" -I standards/scripts/python-project-validation.py
          --project "caller/${{ inputs.project-path }}"
          --work-root "$PYTHON_WORK_ROOT"
          --tool-python "$TOOL_PYTHON"
          --tool-lock standards/examples/python-project/requirements-ci.lock
          --runtime-lock requirements-runtime.lock
          --mypy-config standards/scripts/python-mypy.ini

      - name: Run trusted validator regression tests
        id: regression
        if: always() && steps.lock_verification.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$PYTHON_WORK_ROOT/evidence"
          "$TOOL_PYTHON" -I -m pytest -c /dev/null --rootdir standards \
            -p no:cacheprovider standards/tests/python/python_project_validation_tests.py \
            2>&1 | tee "$PYTHON_WORK_ROOT/evidence/validator-regression.log"

      - name: Normalize Python evidence schema
        id: normalization
        if: always() && steps.lock_verification.outcome == 'success'
        continue-on-error: true
        run: >-
          "$TOOL_PYTHON" -I standards/scripts/Normalize-PythonFunctionalEvidence.py
          --evidence "$PYTHON_WORK_ROOT/evidence"

      - name: Create completion evidence in trusted workspace
        id: completion
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $lockVerificationOutcome = '${{ steps.lock_verification.outcome }}'
          $lockVerificationStarted = '${{ steps.lock_verification.outputs.verifier_started }}' -eq 'true'
          $lockVerificationBlockedReason = '${{ steps.lock_verification.outputs.verifier_blocked_reason }}'
          $durableLockLogPath = Join-Path $env:RUNNER_TEMP 'python-lock-verification.log'
          $lockEvidenceLogPath = Join-Path $env:PYTHON_WORK_ROOT 'evidence/lock-verification.log'
          New-Item -ItemType Directory -Path (Split-Path -Parent $lockEvidenceLogPath) -Force | Out-Null
          if (Test-Path -LiteralPath $durableLockLogPath -PathType Leaf) {
            Copy-Item -LiteralPath $durableLockLogPath -Destination $lockEvidenceLogPath -Force
          }
          $completionPath = Join-Path $env:PYTHON_WORK_ROOT 'evidence/completion-result.json'
          if ($lockVerificationOutcome -eq 'success') {
            if (-not (Test-Path -LiteralPath $lockEvidenceLogPath -PathType Leaf)) {
              throw 'Successful Python lock verification did not produce its durable log.'
            }
            $now = (Get-Date).ToUniversalTime().ToString('o')
            $lockVerificationRecord = [ordered]@{
              schemaVersion = '1.1.0'
              name = 'Python toolchain lock closure'
              category = 'security'
              status = 'Passed'
              requiredValidation = $true
              evidenceSource = 'Automated'
              command = 'python-project-validation.py --verify-tool-lock'
              workingDirectory = 'trusted-isolated-workspace'
              startedAtUtc = $now
              completedAtUtc = $now
              durationSeconds = 0
              runtime = 'CPython 3.13.2 resolver and CPython 3.12.11 functional runtime'
              toolVersion = 'python-project-validation.py'
              exitCode = 0
              summary = 'Python toolchain lock closure completed successfully.'
              warnings = @()
              failureReason = $null
              blockedReason = $null
              notApplicableRationale = $null
              details = [ordered]@{
                outcome = 'success'
                resolverAvailable = $true
                logPath = 'evidence/lock-verification.log'
              }
            }
            $testResultPath = Join-Path $env:PYTHON_WORK_ROOT 'evidence/local-test-results.json'
            $allTestRecords = @($lockVerificationRecord) + @(Get-Content -LiteralPath $testResultPath -Raw | ConvertFrom-Json)
            $allTestRecords | ConvertTo-Json -Depth 10 -AsArray | Set-Content -LiteralPath $testResultPath -Encoding utf8
            & ./standards/scripts/New-CompletionEvidence.ps1 `
              -RepositoryPath $env:PYTHON_WORK_ROOT `
              -SourceRepositoryPath (Join-Path $env:PYTHON_WORK_ROOT 'caller') `
              -OutputPath 'evidence/completion-result.json' `
              -TestResultPath 'evidence/local-test-results.json' `
              -GovernanceVersion 1.1.0 `
              -RiskClassification Moderate `
              -Summary 'Governed Python toolchain lock closure, static analysis, tests, type checking, dependency audit, build, archive inspection, installation, smoke test, and SBOM validation completed.' `
              -CommandsExecuted @('python-project-validation.py --verify-tool-lock','python-project-validation.py') `
              -ArtifactPath @('evidence/lock-verification.log','evidence/local-test-results.json','evidence/python-tests.json','evidence/python-type-check.json','evidence/python-dependency-audit.json','evidence/python-build.json','evidence/python-project-sbom.cdx.json','evidence/python-toolchain-sbom.cdx.json') `
              -Repository $env:GITHUB_REPOSITORY `
              -Branch $env:GITHUB_REF_NAME `
              -ValidatedCommitSha $env:GITHUB_SHA `
              -StandardsRepository 'AIAllTheThingz/Engineering-Standards' `
              -StandardsWorkflowSha '${{ job.workflow_sha }}' `
              -ValidationProfile 'python-functional' `
              -ChecksExecuted @('PythonToolchainLockClosure')
          }
          else {
            $callerStage = Join-Path $env:PYTHON_WORK_ROOT 'caller'
            New-Item -ItemType Directory -Path $callerStage -Force | Out-Null
            $callerStageItem = Get-Item -LiteralPath $callerStage -Force
            if ($callerStageItem.LinkType -or ($callerStageItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Failure evidence caller workspace must not be a link or reparse point.' }
            if (-not (Test-Path -LiteralPath $lockEvidenceLogPath -PathType Leaf)) {
              'The Python lock verifier did not start because a required prerequisite did not complete.' | Set-Content -LiteralPath $lockEvidenceLogPath -Encoding utf8
            }
            $verificationCommand = 'python-project-validation.py --verify-tool-lock'
            $commandsExecuted = @()
            $commandsNotExecuted = @('Toolchain installation and functional validation were not run because lock verification did not succeed.')
            if ($lockVerificationStarted) {
              $commandsExecuted = @($verificationCommand)
            }
            else {
              $commandsNotExecuted += $verificationCommand
            }
            $completionSummary = if ($lockVerificationStarted) { 'Python toolchain lock verification failed before toolchain installation.' } else { 'Python toolchain lock verification could not start before toolchain installation.' }
            $blockedReason = if ($lockVerificationStarted) { $null } elseif ([string]::IsNullOrWhiteSpace($lockVerificationBlockedReason)) { 'The Python lock verifier prerequisite was unavailable, so validation could not start.' } else { $lockVerificationBlockedReason }
            $now = (Get-Date).ToUniversalTime().ToString('o')
            $lockVerificationRecord = [ordered]@{
              schemaVersion = '1.1.0'
              name = 'Python toolchain lock closure'
              category = 'security'
              status = if ($lockVerificationStarted) { 'Failed' } else { 'Blocked' }
              requiredValidation = $true
              evidenceSource = 'Automated'
              command = $verificationCommand
              workingDirectory = 'trusted-isolated-workspace'
              startedAtUtc = $now
              completedAtUtc = $now
              durationSeconds = 0
              runtime = 'CPython 3.13.2 resolver'
              toolVersion = 'python-project-validation.py'
              exitCode = if ($lockVerificationStarted) { 1 } else { $null }
              summary = if ($lockVerificationStarted) { 'The required Python toolchain lock verification did not succeed.' } else { 'The required Python toolchain lock verification could not start.' }
              warnings = @()
              failureReason = if ($lockVerificationStarted) { 'The governed Python toolchain lock verification did not complete successfully.' } else { $null }
              blockedReason = $blockedReason
              notApplicableRationale = $null
              details = [ordered]@{
                outcome = $lockVerificationOutcome
                resolverAvailable = $lockVerificationStarted
                logPath = 'evidence/lock-verification.log'
              }
            }
            @($lockVerificationRecord) | ConvertTo-Json -Depth 10 -AsArray | Set-Content -LiteralPath (Join-Path $env:PYTHON_WORK_ROOT 'evidence/local-test-results.json') -Encoding utf8
            & ./standards/scripts/New-CompletionEvidence.ps1 -RepositoryPath $env:PYTHON_WORK_ROOT -SourceRepositoryPath $callerStage -OutputPath 'evidence/completion-result.json' -TestResultPath 'evidence/local-test-results.json' -GovernanceVersion 1.1.0 -RiskClassification Moderate -Summary $completionSummary -CommandsExecuted $commandsExecuted -CommandsNotExecuted $commandsNotExecuted -BlockedReason $blockedReason -ArtifactPath @('evidence/lock-verification.log','evidence/local-test-results.json') -ArtifactName "python-evidence-$env:GITHUB_RUN_ID" -Repository $env:GITHUB_REPOSITORY -Branch $env:GITHUB_REF_NAME -ValidatedCommitSha $env:GITHUB_SHA -StandardsRepository 'AIAllTheThingz/Engineering-Standards' -StandardsWorkflowSha '${{ job.workflow_sha }}' -ValidationProfile 'python-functional' -ChecksExecuted @('PythonToolchainLockClosure')
          }
          if (-not (Test-Path -LiteralPath $completionPath -PathType Leaf)) { throw 'Completion evidence was not created.' }
          $global:LASTEXITCODE = 0

      - name: Validate Python completion evidence
        id: evidence
        if: always() && steps.completion.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./standards/actions/validate-evidence/Invoke-EvidenceValidation.ps1 -Path $env:PYTHON_WORK_ROOT -EvidencePath 'evidence/completion-result.json' -OutputJson "$env:PYTHON_WORK_ROOT/evidence/evidence-validation.json"

      - name: Record Python validation outcomes
        if: always()
        shell: pwsh
        run: |
          $outcomes = [ordered]@{
            lock_verification = '${{ steps.lock_verification.outcome }}'
            regression = '${{ steps.regression.outcome }}'
            functional = '${{ steps.functional.outcome }}'
            normalization = '${{ steps.normalization.outcome }}'
            completion = '${{ steps.completion.outcome }}'
            evidence = '${{ steps.evidence.outcome }}'
          }
          $outcomes | ConvertTo-Json | Set-Content -LiteralPath "$env:PYTHON_WORK_ROOT/evidence/step-outcomes.json" -Encoding utf8

      - name: Upload Python evidence before enforcement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/python-functional/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Python validation
        if: always()
        shell: pwsh
        run: |
          $outcomes = [ordered]@{
            lock_verification = '${{ steps.lock_verification.outcome }}'
            regression = '${{ steps.regression.outcome }}'
            functional = '${{ steps.functional.outcome }}'
            normalization = '${{ steps.normalization.outcome }}'
            completion = '${{ steps.completion.outcome }}'
            evidence = '${{ steps.evidence.outcome }}'
          }
          $failed = @($outcomes.GetEnumerator() | Where-Object Value -ne 'success')
          if ($failed.Count -gt 0) {
            $summary = ($failed | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Mandatory governed Python validation failed: $summary"
          }
