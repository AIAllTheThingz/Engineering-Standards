name: Issue 103 PostRelease Finalization

on:
  push:
    branches:
      - release/1.2.1-postrelease-finalization
    paths:
      - .github/workflows/issue-103-postrelease-finalization.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/1.2.1-postrelease-finalization
          fetch-depth: 0

      - name: Record completed PostRelease lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Old,
              [Parameter(Mandatory)][string]$New
            )
            $text = Get-Content -LiteralPath $Path -Raw
            if (-not $text.Contains($Old)) {
              throw "Expected text was not found in ${Path}: $Old"
            }
            [System.IO.File]::WriteAllText((Resolve-Path $Path).Path, $text.Replace($Old, $New), [System.Text.UTF8Encoding]::new($false))
          }

          $postRun = '31858980152'
          $postArtifact = '9239916377'
          $postHash = '0acc21c127588ed0dd5c7d5e55bd0f9c087a1c94015cc018b078a5eb1f154717'
          $syncMerge = 'fa34bb533c8288d283996f2aa4f948c3505b61dc'

          Replace-Exact -Path 'docs/RELEASE_STATUS.md' `
            -Old '| Status | Published; published-ref canary verified; final PostRelease lifecycle pending |' `
            -New '| Status | Published; PostRelease lifecycle complete |'

          Replace-Exact -Path 'docs/RELEASE_STATUS.md' `
            -Old '- Publication lifecycle: run `31853146258`, Passed; artifact `9238154042` independently verified.' `
            -New "- Publication lifecycle: run ``31853146258``, Passed; artifact ``9238154042`` independently verified.`n- Final PostRelease lifecycle: run ``$postRun``, Passed; artifact ``$postArtifact`` independently downloaded and SHA-256 verified as ``$postHash``."

          Replace-Exact -Path 'docs/RELEASE_STATUS.md' `
            -Old 'Final PostRelease lifecycle validation remains pending until this state synchronization is merged and the refreshed compatibility state is machine-checked.' `
            -New "Final PostRelease lifecycle validation passed in run ``$postRun`` after PR #109 merge ``$syncMerge``; artifact ``$postArtifact`` was independently hash verified and the refreshed compatibility state was machine-checked."

          Replace-Exact -Path 'docs/RELEASE_STATUS.md' `
            -Old 'Issue #103 may be closed only after this repository status synchronization is merged and the final PostRelease lifecycle gate records the refreshed compatibility state.' `
            -New "Issue #103 was closed as completed after PR #109 merged at ``$syncMerge`` and final PostRelease lifecycle run ``$postRun`` passed against the refreshed compatibility state."

          Replace-Exact -Path 'README.md' `
            -Old 'For `v1.2.1`, exact-candidate success and controlled-failure proof, PreRelease, Publication, attributable human approval, and the published-ref five-scenario canary are complete; final repository PostRelease state synchronization is tracked by issue #103.' `
            -New "For ``v1.2.1``, exact-candidate success and controlled-failure proof, PreRelease, Publication, attributable human approval, the published-ref five-scenario canary, repository state synchronization, and final PostRelease lifecycle validation are complete. Final run ``$postRun`` passed after PR #109 merge ``$syncMerge``, and issue #103 is closed."

          Replace-Exact -Path 'README.md' `
            -Old 'Published v1.2.1 consumers requiring the canary-validated repaired workflow should pin `.github/workflows/governance-ci-reusable.yml@7d15ec8be6d8c3cdca35061728901584437e4a50`; the protected annotated `v1.2.1` reference is also verified by the published-ref canary, while the full SHA remains preferred for workflow execution. Final PostRelease lifecycle validation remains pending until the release-state synchronization is merged.' `
            -New "Published v1.2.1 production workflow consumers MUST pin ``.github/workflows/governance-ci-reusable.yml@7d15ec8be6d8c3cdca35061728901584437e4a50`` by full commit SHA. The protected annotated ``v1.2.1`` reference remains release/canary/lifecycle identity and MUST NOT be the sole production GitHub Actions workflow identity. Final PostRelease lifecycle run ``$postRun`` passed with independently verified artifact ``$postArtifact``."

          Replace-Exact -Path 'docs/DOWNSTREAM_COMPATIBILITY.md' `
            -Old '| Status | Active; v1.2.1 published; published-ref canary verified; final PostRelease lifecycle pending |' `
            -New '| Status | Active; v1.2.1 published; PostRelease lifecycle complete |'

          Replace-Exact -Path 'docs/DOWNSTREAM_COMPATIBILITY.md' `
            -Old 'Final PostRelease lifecycle validation remains pending until this repository synchronization is merged.' `
            -New "Final PostRelease lifecycle validation passed in run ``$postRun`` after repository synchronization merge ``$syncMerge``; artifact ``$postArtifact`` was independently verified."

          Replace-Exact -Path 'docs/releases/unreleased.md' `
            -Old '- The published v1.2.1 five-scenario canary proves the immutable release path; it does not validate the later PR #108 master state, and final PostRelease lifecycle validation remains pending until the release-state synchronization is merged.' `
            -New "- The published v1.2.1 five-scenario canary proves the immutable release path; it does not validate later moving-master content. Final PostRelease lifecycle run ``$postRun`` passed after synchronization merge ``$syncMerge`` while the current ``unreleasedContract`` correctly remains Preview/NotRun."

          Replace-Exact -Path 'CHANGELOG.md' `
            -Old '- Published `v1.2.1` production consumers requiring the canary-validated repaired workflow MUST pin `.github/workflows/governance-ci-reusable.yml@7d15ec8be6d8c3cdca35061728901584437e4a50` by full commit SHA. The protected annotated `v1.2.1` path remains verified as human-readable release identity and published-ref canary/lifecycle evidence, but it MUST NOT be the sole production GitHub Actions workflow identity. Final PostRelease lifecycle validation remains pending until repository state synchronization is merged.' `
            -New "- Published ``v1.2.1`` production consumers requiring the canary-validated repaired workflow MUST pin ``.github/workflows/governance-ci-reusable.yml@7d15ec8be6d8c3cdca35061728901584437e4a50`` by full commit SHA. The protected annotated ``v1.2.1`` path remains verified as human-readable release identity and published-ref canary/lifecycle evidence, but it MUST NOT be the sole production GitHub Actions workflow identity. Final PostRelease lifecycle run ``$postRun`` passed after repository state synchronization merge ``$syncMerge``."

          Replace-Exact -Path 'CHANGELOG.md' `
            -Old '- Attributable exact-candidate human release approval was recorded by `mezuccolini`; no published-ref canary regression or defect follow-up issue was required; final PostRelease lifecycle validation remains pending.' `
            -New "- Attributable exact-candidate human release approval was recorded by ``mezuccolini``; no published-ref canary regression or defect follow-up issue was required.`n- Final PostRelease lifecycle run ``$postRun`` passed with independently verified artifact ``$postArtifact`` (SHA-256 ``$postHash``) after PR #109 merge ``$syncMerge`` synchronized the published compatibility state."

      - name: Validate final release status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'docs/RELEASE_STATUS.md',
            'README.md',
            'docs/DOWNSTREAM_COMPATIBILITY.md',
            'docs/releases/unreleased.md',
            'CHANGELOG.md'
          )
          $combined = ($paths | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join "`n"
          foreach ($stale in @(
            'final PostRelease lifecycle pending',
            'Final PostRelease lifecycle validation remains pending',
            'final repository PostRelease state synchronization is tracked by issue #103',
            'full SHA remains preferred for workflow execution'
          )) {
            if ($combined.Contains($stale)) { throw "Stale PostRelease wording remains: $stale" }
          }
          if ($combined -notmatch '31858980152') { throw 'Final PostRelease run is not recorded.' }
          if ($combined -notmatch '9239916377') { throw 'Final PostRelease artifact is not recorded.' }
          & git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          pwsh -NoProfile -File scripts/Test-ReleaseConsistency.ps1 -Path .

      - name: Commit final status and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AIAllTheThingz Automation'
          git config user.email 'aiallthethingz@users.noreply.github.com'
          git rm .github/workflows/issue-103-postrelease-finalization.yml
          git add docs/RELEASE_STATUS.md README.md docs/DOWNSTREAM_COMPATIBILITY.md docs/releases/unreleased.md CHANGELOG.md
          git commit -m 'docs(release): record completed v1.2.1 PostRelease gate'
          git push origin HEAD:release/1.2.1-postrelease-finalization
